# nginx fronts the three coordinator replicas. It listens ONLY on the Unix
# socket kube-apiserver dials (--service-account-signing-endpoint): no TCP
# listener. It reaches the replicas over lb-net with mTLS: it presents the
# "lb" client cert and verifies each replica's "coordinator-grpc" server cert
# against the deployment CA. Replicas are addressed by static IP so a stopped
# or restarted replica never breaks name resolution (E8).
events {
    worker_connections 1024;
}

http {
    # Timing (NOTES N64): one JSON line per request on stdout. Arrival at nginx =
    # msec - request_time. request_id is also sent to the coordinator
    # (X-Frost-Nginx-Request-Id, with X-Frost-Nginx-Msec = the proxy time), which
    # logs it, so nginx and coordinator lines join exactly.
    log_format frost_timing escape=json
        '{"src":"nginx","msec":"$msec","request_time":"$request_time","request_id":"$request_id",'
        '"uri":"$uri","status":"$status","grpc_status":"$upstream_trailer_grpc_status",'
        '"upstream":"$upstream_addr","upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time","upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout frost_timing;

    upstream coordinators {
        server 172.30.1.11:9090 max_fails=1 fail_timeout=5s;
        server 172.30.1.12:9090 max_fails=1 fail_timeout=5s;
        server 172.30.1.13:9090 max_fails=1 fail_timeout=5s;
    }

    server {
        listen unix:/var/run/frost-k8s/signer.sock http2;

        location / {
            grpc_pass grpcs://coordinators;
            grpc_ssl_certificate         /etc/nginx/lb-tls/tls.crt;
            grpc_ssl_certificate_key     /etc/nginx/lb-tls/tls.key;
            grpc_ssl_trusted_certificate /etc/nginx/ca.crt;
            grpc_ssl_verify              on;
            grpc_ssl_verify_depth        1;
            grpc_ssl_name                coordinator-grpc;
            grpc_ssl_server_name         on;
            grpc_ssl_protocols           TLSv1.3;
            grpc_ssl_session_reuse       on;

            # Timing only (N64); the coordinator logs these, never acts on them.
            grpc_set_header X-Frost-Nginx-Request-Id $request_id;
            grpc_set_header X-Frost-Nginx-Msec       $msec;

            # A retried Sign re-runs the fan-out on another replica. Worst case:
            # extra audit entries and rate-limit hits; the same claims yield the
            # same deterministic signature (docs/THREAT_MODEL.md, NOTES N34).
            grpc_next_upstream error timeout non_idempotent;
            grpc_next_upstream_tries 3;
            grpc_connect_timeout 1s;
            grpc_read_timeout 5s;
        }
    }
}
