# nginx fronts the three coordinator replicas. It listens on the Unix socket
# kube-apiserver dials (--service-account-signing-endpoint) and load-balances
# gRPC to the replicas, trying the next one on connection failure (E8).
# Replicas are addressed by static IP (deploy/docker-compose.yml) so a stopped
# or restarted replica never breaks name resolution.
events {
    worker_connections 1024;
}

http {
    upstream coordinators {
        server 172.30.0.11:9090 max_fails=1 fail_timeout=5s;
        server 172.30.0.12:9090 max_fails=1 fail_timeout=5s;
        server 172.30.0.13:9090 max_fails=1 fail_timeout=5s;
    }

    server {
        listen unix:/var/run/frost-k8s/signer.sock http2;
        listen 9090 http2;

        location / {
            grpc_pass grpc://coordinators;
            grpc_next_upstream error timeout non_idempotent;  # Sign is safe to retry on another replica
            grpc_next_upstream_tries 3;
            grpc_connect_timeout 1s;
            grpc_read_timeout 5s;
        }
    }
}
