# frost-k8s threshold RSA deployment (Linux host; validated by make e2e).
#
# Inputs (all under ../secrets/, git- and docker-ignored):
#   keys/public-meta.json, keys/share-<i>.json    from cmd/dealer
#   tls/ca.crt, tls/<name>/tls.{crt,key}           from scripts/gen-certs.sh
# Each signer mounts ONLY its own share and its own cert (I4). Coordinators
# mount only public metadata, the policy, the CA cert and their two certs
# (I3). The CA private key (secrets/ca/) is never mounted.
# Containers run as FROST_UID (required, e.g. FROST_UID=$(id -u)) so they can
# read the 0600 share/key files the dealer and gen-certs.sh wrote.
#
# Who can reach Sign (Phase 6.5, docs/THREAT_MODEL.md):
#   kube-apiserver --unix socket ../run/signer.sock--> nginx
#   nginx --lb-net, mTLS (client SAN "lb")--> grpc-proxy-1..3 (server SAN "coordinator-grpc")
#   grpc-proxy --signer-net, mTLS (client SAN "coordinator")--> signer-1..5
# lb-net and signer-net are `internal` bridges with inhibit_ipv4: no egress,
# and the Docker host itself has no address on them, so it cannot connect.
# NO port of any service is published to the host.

x-net-opts: &net-opts
  driver: bridge
  internal: true
  driver_opts:
    com.docker.network.bridge.inhibit_ipv4: "true"

x-signer: &signer
  build:
    context: ..
    dockerfile: deploy/docker/Dockerfile.signer
  image: frost-k8s/signer:dev
  user: "${FROST_UID:?set FROST_UID, e.g. FROST_UID=$(id -u)}"
  read_only: true
  restart: unless-stopped

x-coordinator: &coordinator
  build:
    context: ..
    dockerfile: deploy/docker/Dockerfile.proxy
  image: frost-k8s/coordinator:dev
  user: "${FROST_UID:?set FROST_UID, e.g. FROST_UID=$(id -u)}"
  read_only: true
  restart: unless-stopped
  environment:
    META_FILE: /etc/frost/public-meta.json
    POLICY_FILE: /etc/frost/policy.json
    SIGNER_ENDPOINTS: "1=https://signer-1:8443,2=https://signer-2:8443,3=https://signer-3:8443,4=https://signer-4:8443,5=https://signer-5:8443"
    TLS_CERT: /etc/frost/tls/tls.crt
    TLS_KEY: /etc/frost/tls/tls.key
    TLS_CA: /etc/frost/ca.crt
    TCP_ADDR: 0.0.0.0:9090
    GRPC_TLS_CERT: /etc/frost/grpc-tls/tls.crt
    GRPC_TLS_KEY: /etc/frost/grpc-tls/tls.key
    GRPC_TLS_CA: /etc/frost/ca.crt
    SIGN_DEADLINE: ${SIGN_DEADLINE:-2s}
    VERIFY_STRATEGY: ${VERIFY_STRATEGY:-strict}
  volumes:
    - ../secrets/keys/public-meta.json:/etc/frost/public-meta.json:ro
    - ./policy.json:/etc/frost/policy.json:ro
    - ../secrets/tls/ca.crt:/etc/frost/ca.crt:ro
    - ../secrets/tls/coordinator:/etc/frost/tls:ro
    - ../secrets/tls/coordinator-grpc:/etc/frost/grpc-tls:ro
  depends_on: [signer-1, signer-2, signer-3, signer-4, signer-5]

services:
  signer-1:
    <<: *signer
    environment:
      SIGNER_ID: "1"
      META_FILE: /etc/frost/public-meta.json
      SHARE_FILE: /run/frost/share.json
      POLICY_FILE: /etc/frost/policy.json
      AUDIT_LOG: /var/log/frost/audit.log
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      LISTEN_ADDR: ":8443"
    volumes:
      - ../secrets/keys/share-1.json:/run/frost/share.json:ro
      - ../secrets/keys/public-meta.json:/etc/frost/public-meta.json:ro
      - ./policy.json:/etc/frost/policy.json:ro
      - ../secrets/tls/ca.crt:/etc/frost/ca.crt:ro
      - ../secrets/tls/signer-1:/etc/frost/tls:ro
      - ../audit/signer-1:/var/log/frost
    networks:
      signer-net:
        ipv4_address: 172.30.2.21

  signer-2:
    <<: *signer
    environment:
      SIGNER_ID: "2"
      META_FILE: /etc/frost/public-meta.json
      SHARE_FILE: /run/frost/share.json
      POLICY_FILE: /etc/frost/policy.json
      AUDIT_LOG: /var/log/frost/audit.log
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      LISTEN_ADDR: ":8443"
    volumes:
      - ../secrets/keys/share-2.json:/run/frost/share.json:ro
      - ../secrets/keys/public-meta.json:/etc/frost/public-meta.json:ro
      - ./policy.json:/etc/frost/policy.json:ro
      - ../secrets/tls/ca.crt:/etc/frost/ca.crt:ro
      - ../secrets/tls/signer-2:/etc/frost/tls:ro
      - ../audit/signer-2:/var/log/frost
    networks:
      signer-net:
        ipv4_address: 172.30.2.22

  signer-3:
    <<: *signer
    environment:
      SIGNER_ID: "3"
      META_FILE: /etc/frost/public-meta.json
      SHARE_FILE: /run/frost/share.json
      POLICY_FILE: /etc/frost/policy.json
      AUDIT_LOG: /var/log/frost/audit.log
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      LISTEN_ADDR: ":8443"
    volumes:
      - ../secrets/keys/share-3.json:/run/frost/share.json:ro
      - ../secrets/keys/public-meta.json:/etc/frost/public-meta.json:ro
      - ./policy.json:/etc/frost/policy.json:ro
      - ../secrets/tls/ca.crt:/etc/frost/ca.crt:ro
      - ../secrets/tls/signer-3:/etc/frost/tls:ro
      - ../audit/signer-3:/var/log/frost
    networks:
      signer-net:
        ipv4_address: 172.30.2.23

  signer-4:
    <<: *signer
    environment:
      SIGNER_ID: "4"
      META_FILE: /etc/frost/public-meta.json
      SHARE_FILE: /run/frost/share.json
      POLICY_FILE: /etc/frost/policy.json
      AUDIT_LOG: /var/log/frost/audit.log
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      LISTEN_ADDR: ":8443"
    volumes:
      - ../secrets/keys/share-4.json:/run/frost/share.json:ro
      - ../secrets/keys/public-meta.json:/etc/frost/public-meta.json:ro
      - ./policy.json:/etc/frost/policy.json:ro
      - ../secrets/tls/ca.crt:/etc/frost/ca.crt:ro
      - ../secrets/tls/signer-4:/etc/frost/tls:ro
      - ../audit/signer-4:/var/log/frost
    networks:
      signer-net:
        ipv4_address: 172.30.2.24

  signer-5:
    <<: *signer
    environment:
      SIGNER_ID: "5"
      META_FILE: /etc/frost/public-meta.json
      SHARE_FILE: /run/frost/share.json
      POLICY_FILE: /etc/frost/policy.json
      AUDIT_LOG: /var/log/frost/audit.log
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      LISTEN_ADDR: ":8443"
    volumes:
      - ../secrets/keys/share-5.json:/run/frost/share.json:ro
      - ../secrets/keys/public-meta.json:/etc/frost/public-meta.json:ro
      - ./policy.json:/etc/frost/policy.json:ro
      - ../secrets/tls/ca.crt:/etc/frost/ca.crt:ro
      - ../secrets/tls/signer-5:/etc/frost/tls:ro
      - ../audit/signer-5:/var/log/frost
    networks:
      signer-net:
        ipv4_address: 172.30.2.25

  grpc-proxy-1:
    <<: *coordinator
    networks:
      lb-net:
        ipv4_address: 172.30.1.11
      signer-net:
        ipv4_address: 172.30.2.11

  grpc-proxy-2:
    <<: *coordinator
    networks:
      lb-net:
        ipv4_address: 172.30.1.12
      signer-net:
        ipv4_address: 172.30.2.12

  grpc-proxy-3:
    <<: *coordinator
    networks:
      lb-net:
        ipv4_address: 172.30.1.13
      signer-net:
        ipv4_address: 172.30.2.13

  coordinator-lb:
    image: nginx:1.29-alpine
    restart: unless-stopped
    # Remove a socket left by an unclean exit, or nginx cannot bind it.
    entrypoint: ["/bin/sh", "-c", "rm -f /var/run/frost-k8s/signer.sock && exec nginx -g 'daemon off;'"]
    depends_on: [grpc-proxy-1, grpc-proxy-2, grpc-proxy-3]
    volumes:
      - ./nginx-grpc.conf:/etc/nginx/nginx.conf:ro
      - ../run:/var/run/frost-k8s
      - ../secrets/tls/lb:/etc/nginx/lb-tls:ro
      - ../secrets/tls/ca.crt:/etc/nginx/ca.crt:ro
    networks:
      lb-net:
        ipv4_address: 172.30.1.5
    # No ports: nginx listens only on the Unix socket.

networks:
  lb-net:
    <<: *net-opts
    ipam:
      config:
        - subnet: 172.30.1.0/24
  signer-net:
    <<: *net-opts
    ipam:
      config:
        - subnet: 172.30.2.0/24
