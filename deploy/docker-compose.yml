services:
  signer-1:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.signer
    environment:
      - SIGNER_ID=1
      - PORT=8081
    networks:
      - minikube

  signer-2:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.signer
    environment:
      - SIGNER_ID=2
      - PORT=8082
    networks:
      - minikube

  signer-3:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.signer
    environment:
      - SIGNER_ID=3
      - PORT=8083
    networks:
      - minikube

  signer-4:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.signer
    environment:
      - SIGNER_ID=4
      - PORT=8084
    networks:
      - minikube

  signer-5:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.signer
    environment:
      - SIGNER_ID=5
      - PORT=8085
    networks:
      - minikube

  grpc-proxy:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.proxy
    environment:
      - SIGNER_1_ADDR=http://signer-1:8081
      - SIGNER_2_ADDR=http://signer-2:8082
      - SIGNER_3_ADDR=http://signer-3:8083
      - SIGNER_4_ADDR=http://signer-4:8084
      - SIGNER_5_ADDR=http://signer-5:8085
      - TCP_ADDR=0.0.0.0:9090
      - KEY_ID=frost-k8s-v1
    ports:
      - "9090:9090"
    depends_on:
      - signer-1
      - signer-2
      - signer-3
      - signer-4
      - signer-5
    networks:
      - minikube

networks:
  minikube:
    external: true
