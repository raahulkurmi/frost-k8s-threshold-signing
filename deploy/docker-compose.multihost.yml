# frost-k8s MULTI-HOST topology, coordinator host only (Phase 7B).
# Signers run natively on separate hosts (deploy/multihost/). This file runs
# nginx + 3 coordinator replicas; it holds NO share (deploy.sh installs only
# public-meta.json and coordinator-side certs into ../secrets).
# The single-host topology (signers in containers) is deploy/docker-compose.yml.
#
# Reachability:
#   kube-apiserver --unix socket ../run/signer.sock (dir root:root 0700)--> nginx
#   nginx --lb-net (internal, host-unreachable), mTLS "lb"--> grpc-proxy-1..3
#   grpc-proxy --uplink (NAT via this host), mTLS "coordinator"--> signer hosts
# Coordinators bind gRPC ONLY to their lb-net address, so nothing listens on the
# uplink; DOCKER-USER (coordinator-egress.sh) lets the uplink reach only the
# signer IP:port pairs. SIGNER_ENDPOINTS comes from ../secrets/multihost.env.

x-coordinator-common: &coord
  build:
    context: ..
    dockerfile: deploy/docker/Dockerfile.proxy
  image: frost-k8s/coordinator:dev
  user: "${FROST_UID:?set FROST_UID, e.g. FROST_UID=$(id -u)}"
  read_only: true
  restart: unless-stopped
  volumes:
    - ../secrets/keys/public-meta.json:/etc/frost/public-meta.json:ro
    - ./policy.json:/etc/frost/policy.json:ro
    - ../secrets/tls/ca.crt:/etc/frost/ca.crt:ro
    - ../secrets/tls/coordinator:/etc/frost/tls:ro
    - ../secrets/tls/coordinator-grpc:/etc/frost/grpc-tls:ro

services:
  grpc-proxy-1:
    <<: *coord
    environment:
      META_FILE: /etc/frost/public-meta.json
      POLICY_FILE: /etc/frost/policy.json
      SIGNER_ENDPOINTS: "${SIGNER_ENDPOINTS:?set SIGNER_ENDPOINTS (from secrets/multihost.env)}"
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      TCP_ADDR: 172.30.1.11:9090
      GRPC_TLS_CERT: /etc/frost/grpc-tls/tls.crt
      GRPC_TLS_KEY: /etc/frost/grpc-tls/tls.key
      GRPC_TLS_CA: /etc/frost/ca.crt
      SIGN_DEADLINE: ${SIGN_DEADLINE:-2s}
      VERIFY_STRATEGY: ${VERIFY_STRATEGY:-strict}
      FANOUT: ${FANOUT:-all}
      HEDGE_DELAY: ${HEDGE_DELAY:-50ms}
    networks:
      lb-net:
        ipv4_address: 172.30.1.11
      uplink:
        ipv4_address: 172.30.3.11

  grpc-proxy-2:
    <<: *coord
    environment:
      META_FILE: /etc/frost/public-meta.json
      POLICY_FILE: /etc/frost/policy.json
      SIGNER_ENDPOINTS: "${SIGNER_ENDPOINTS:?set SIGNER_ENDPOINTS (from secrets/multihost.env)}"
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      TCP_ADDR: 172.30.1.12:9090
      GRPC_TLS_CERT: /etc/frost/grpc-tls/tls.crt
      GRPC_TLS_KEY: /etc/frost/grpc-tls/tls.key
      GRPC_TLS_CA: /etc/frost/ca.crt
      SIGN_DEADLINE: ${SIGN_DEADLINE:-2s}
      VERIFY_STRATEGY: ${VERIFY_STRATEGY:-strict}
      FANOUT: ${FANOUT:-all}
      HEDGE_DELAY: ${HEDGE_DELAY:-50ms}
    networks:
      lb-net:
        ipv4_address: 172.30.1.12
      uplink:
        ipv4_address: 172.30.3.12

  grpc-proxy-3:
    <<: *coord
    environment:
      META_FILE: /etc/frost/public-meta.json
      POLICY_FILE: /etc/frost/policy.json
      SIGNER_ENDPOINTS: "${SIGNER_ENDPOINTS:?set SIGNER_ENDPOINTS (from secrets/multihost.env)}"
      TLS_CERT: /etc/frost/tls/tls.crt
      TLS_KEY: /etc/frost/tls/tls.key
      TLS_CA: /etc/frost/ca.crt
      TCP_ADDR: 172.30.1.13:9090
      GRPC_TLS_CERT: /etc/frost/grpc-tls/tls.crt
      GRPC_TLS_KEY: /etc/frost/grpc-tls/tls.key
      GRPC_TLS_CA: /etc/frost/ca.crt
      SIGN_DEADLINE: ${SIGN_DEADLINE:-2s}
      VERIFY_STRATEGY: ${VERIFY_STRATEGY:-strict}
      FANOUT: ${FANOUT:-all}
      HEDGE_DELAY: ${HEDGE_DELAY:-50ms}
    networks:
      lb-net:
        ipv4_address: 172.30.1.13
      uplink:
        ipv4_address: 172.30.3.13

  coordinator-lb:
    image: nginx:1.29-alpine
    restart: unless-stopped
    # Access control is the parent directory ../run (root:root 0700); nginx
    # forces the socket itself to 0666 (NOTES N36).
    entrypoint: ["/bin/sh", "-c", "rm -f /var/run/frost-k8s/signer.sock && exec nginx -g 'daemon off;'"]
    depends_on: [grpc-proxy-1, grpc-proxy-2, grpc-proxy-3]
    volumes:
      - ./nginx-grpc.conf:/etc/nginx/nginx.conf:ro
      - ../run:/var/run/frost-k8s
      - ../secrets/tls/lb:/etc/nginx/lb-tls:ro
      - ../secrets/tls/ca.crt:/etc/nginx/ca.crt:ro
    networks:
      lb-net:
        ipv4_address: 172.30.1.5

networks:
  lb-net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 172.30.1.0/24
  uplink:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.30.3.0/24
