# Phase 7A B0 baseline: stock kind, in-tree service account key (kubeadm's
# sa.key), same node image, same topology (1 control plane + 1 worker) and same
# issuer as the T/B1 clusters (test/e2e/kind-config.yaml.tmpl).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tk8s
nodes:
- role: control-plane
  image: kindest/node:v1.36.5-tk8s
- role: worker
  image: kindest/node:v1.36.5-tk8s
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      service-account-issuer: https://kubernetes.default.svc.cluster.local
