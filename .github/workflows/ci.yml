# CI for frost-k8s-threshold-signing. Actions are pinned by commit SHA (tag in the
# trailing comment); tool downloads are checksum-verified; Go is pinned.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  GOTOOLCHAIN: local
  STATICCHECK_VERSION: v0.8.1
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: "8.30.1"
  KIND_VERSION: v0.31.0
  KUBECTL_VERSION: v1.36.5
  K8S_NODE_VERSION: v1.36.5

jobs:
  static:
    name: vet, staticcheck, govulncheck, gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            benchmark/go.sum
      - name: go version
        run: go version
      - name: go vet (default and testmalicious builds)
        run: |
          go vet ./...
          go vet -tags testmalicious ./...
          (cd benchmark && go vet ./...)
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck ./...
          staticcheck -tags testmalicious ./...
          (cd benchmark && staticcheck ./...)
      - name: govulncheck (fails on any reachable vulnerability not accepted in reports/ci/govulncheck-accepted.txt)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          scripts/govulncheck.sh
          scripts/govulncheck.sh benchmark
      - name: install gitleaks (checksum-verified)
        run: scripts/ci-install-gitleaks.sh
      - name: gitleaks (working tree)
        run: gitleaks detect --no-git --source . --redact --no-banner -v

  test:
    name: make test (T1-T12, T5 testmalicious)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install gitleaks (T11 requires it when CI is set)
        run: scripts/ci-install-gitleaks.sh
      - name: make test
        env:
          CI: "true"
        run: make test

  e2e:
    name: images + kind e2e (Kubernetes v1.36.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install kind and kubectl (checksum-verified)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" | awk '{print $1"  kind"}' | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c -
          sudo install -m 0755 kind kubectl /usr/local/bin/
          kind version; kubectl version --client
      - name: build kind node image from the official ${{ env.K8S_NODE_VERSION }} release
        run: kind build node-image --type release "${K8S_NODE_VERSION}" --image kindest/node:v1.36.5-tk8s
      - name: environment
        run: |
          uname -a; nproc; free -h; docker version --format 'docker {{.Server.Version}}'
          docker image inspect kindest/node:v1.36.5-tk8s --format 'node image {{.Id}}'
      - name: make check-images (T13)
        run: make check-images
      - name: make e2e (E1-E8, REQ-a..d, N1-N3)
        run: make e2e
      - name: upload e2e log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-log
          path: test/e2e/results/*/e2e.log
          if-no-files-found: warn
